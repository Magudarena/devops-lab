version: '3.8'
services:
  webapp:
    build: .
    container_name: python-app
    ports:
      - "8000:8000"
    networks:
      - app-network

  webserver:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
